name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.23.4', '24.22.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Guard test count
        shell: bash
        run: |
          count=$(find dist -name '*.test.js' | wc -l)
          echo "test files: $count"
          if [ "$count" -lt 7 ]; then echo "expected at least 7 test files"; exit 1; fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run prepack
      - run: node scripts/smoke.mjs
